plugins:
#定义了一个带过期缓存的内部使用/外部使用的国外dns服务器（带ecs），供表外域名第一次解析使用
#在不泄露版本中，供不在域名列表中的域名初次解析使用
  - tag: foreignecs
    type: aliapi
    args:
      concurrent: 1
      proxy: $main_proxy
      upstreams:
        - tag: google-foreignecs                #原生要求上游标签全局唯一，foreign 组已占用 google
          addr: "https://dns.google/dns-query"
          dial_addr: "8.8.8.8"
          use_proxy: true

  - tag: sequence_google_node
    type: sequence
    args:
      - exec: ecs $client_ecs
      - exec: $cache_google_node                    #定义: sub_config/cache.yaml:44
      - exec: flow_setter sequence=sequence_google_node upstream=foreignecs
      - exec: $foreignecs                           #定义: sub_config/forward_nocn_ecs.yaml:4
      - exec: cname_remover
