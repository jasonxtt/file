plugins:
#国外上游组：代理域名（RealIP 分流）、realiplist、其他查询类型、刷新时的二次确认都用它
  - tag: foreign
    type: aliapi
    args:
      concurrent: 2
      proxy: $main_proxy                        #main_proxy 地址为空时直连；填写后下面 use_proxy: true 的条目经它连接；定义: sub_config/settings.yaml
      upstreams:
        - tag: google
          addr: "https://dns.google/dns-query"
          dial_addr: "8.8.8.8"
          use_proxy: true
        - tag: cloudflare
          addr: "https://1.1.1.1/dns-query"
          use_proxy: true
