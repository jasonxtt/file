plugins:
#定义了一个带过期缓存的内部使用/外部使用的国外dns服务器
#转发dns请求到国外dns
  - tag: foreign
    type: aliapi
    args:
      concurrent: 2
      proxy: $main_proxy                        #main_proxy 地址为空时直连；填写后下面 use_proxy: true 的条目经它连接；定义: sub_config/settings.yaml
      upstreams:
        - tag: google
          addr: "https://dns.google/dns-query"
          dial_addr: "8.8.8.8"
          use_proxy: true
        - tag: cloudflare
          addr: "https://1.1.1.1/dns-query"
          use_proxy: true
