mixed-port: 7890
allow-lan: true
bind-address: '*'
mode: rule
log-level: info
external-controller: '127.0.0.1:9090'
dns:
    enable: true
    ipv6: true
    default-nameserver: [223.5.5.5, 119.29.29.29]
    enhanced-mode: fake-ip
    fake-ip-range: 198.18.0.1/16
    use-hosts: true
    nameserver: ['https://doh.pub/dns-query', 'https://dns.alidns.com/dns-query']
    fallback: ['https://doh.dns.sb/dns-query', 'https://dns.cloudflare.com/dns-query', 'https://dns.twnic.tw/dns-query', 'tls://8.8.4.4:853']
    fallback-filter: { geoip: true, ipcidr: [240.0.0.0/4, 0.0.0.0/32] }
proxies:
    - { name: 'ss-in-natter', type: ss, server: 180.1.1.1, port: 4105, cipher: 2022-blake3-aes-128-gcm, password: 'U=111111', smux: { enabled: true, protocol: h2mux, max-connections: 1, min-streams: 4, padding: false }, brutal-opts: { enabled: false, up: '50 Mbps', down: '55 Mbps' } }
    - { name: 'hy2-in-natter', type: hysteria2, server: 180.1.1.1, port: 4103, password: 111111, up: '50 Mbps', down: '55 Mbps', sni: bing.com, skip-cert-verify: true, alpn: ['h3'] }
proxy-groups:
    - { name: Proxy, type: select, proxies: ['ss-in-natter', 'hy2-in-natter'] }

rules:
    - IP-CIDR,10.0.0.0/24,Proxy,no-resolve    #改为自己家里网段
    - 'GEOIP,CN,DIRECT,no-resolve'
    - 'GEOSITE,CN,DIRECT'
    - 'MATCH,Proxy'
